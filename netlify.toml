[build]
  # Static site: index.html + app.js + model_web.json, no build step needed.
  # Overrides the interactive `npm init` command set in the Netlify UI.
  command = "echo 'No build step required'"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
